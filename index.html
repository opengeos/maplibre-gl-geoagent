<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maplibre-gl-geoagent Examples</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      background: #eef2f6;
      color: #17202a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2.25rem;
      line-height: 1.1;
    }

    .subtitle {
      margin: 0 0 32px;
      color: #5f6b7a;
      font-size: 1.05rem;
    }

    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .example-card {
      display: block;
      padding: 20px;
      border: 1px solid #d7dde5;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }

    .example-card:hover {
      border-color: #0f766e;
    }

    .example-card h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .example-card p {
      margin: 0 0 16px;
      color: #5f6b7a;
      line-height: 1.5;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 4px 10px;
      border-radius: 4px;
      background: #edf2f7;
      color: #445160;
      font-size: 0.8rem;
      font-weight: 650;
    }

    .footer {
      margin-top: 32px;
      color: #5f6b7a;
    }

    .footer a {
      color: #0f766e;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>maplibre-gl-geoagent</h1>
    <p class="subtitle">A browser-only GeoAgent control for MapLibre maps.</p>

    <div class="examples-grid">
      <a href="./examples/basic/index.html" class="example-card">
        <h2>Basic Example</h2>
        <p>Use the vanilla `GeoAgentControl` with a MapLibre map.</p>
        <div class="tags">
          <span class="tag">Vanilla JS</span>
          <span class="tag">TypeScript</span>
        </div>
      </a>

      <a href="./examples/react/index.html" class="example-card">
        <h2>React Example</h2>
        <p>Use `GeoAgentControlReact` and the React state hook.</p>
        <div class="tags">
          <span class="tag">React</span>
          <span class="tag">TypeScript</span>
        </div>
      </a>
    </div>

    <div class="footer">
      <a href="https://github.com/opengeos/maplibre-gl-geoagent">GitHub</a>
      ·
      <a href="https://www.npmjs.com/package/maplibre-gl-geoagent">npm</a>
    </div>
  </div>
</body>
</html>
